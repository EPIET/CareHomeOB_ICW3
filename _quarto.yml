project:
  type: website
  output-dir: web

website:
  title: "Carehome Outbreak Exercise"
  
  navbar:
    background: dark        
    foreground: light
    pinned: true
    search: true
    left:
      - text: "Import and Clean Data"
        href: "scripts/01_Import_Cleaning.qmd"
      - text: "Case Definition"
        href: "scripts/02_Case_Definition.qmd"
      - text: "Descriptive Analysis & Lab Results"
        href: "scripts/03_Descriptive_LabResults.qmd"
      - text: "Univariate Analysis"
        href: "scripts/04_Univariate_Analyses.qmd"
      - text: "Stratified Analysis"
        href: "scripts/05_Stratified_Analyses.qmd"

    tools:
      - icon: github
        menu:
          - text: "Source Code"
            url:  https://github.com/EPIET/IntroToRCourse/tree/main
          - text: "Report an issue"
            url:  https://github.com/EPIET/IntroToRCourse/issues
  

  page-footer:
    left: "© 2026 – Intro to R Course"
    right:
      - icon: github
        href: https://github.com/EPIET/IntroToRCourse


format:
  html:
    theme: cosmo
    page-layout: article
    grid:
      body-width: 900px
      margin-width: 250px
      sidebar-width: 250px
      gutter-width: 1.5rem
    code-fold: false
    code-summary: "Show the code"
    code-tools: true
    code-copy: true
    toc: true
    toc-depth: 3
    toc-expand: true
    number-depth: 2
    link-external-newwindow: true
    embed-resources: false
    css: 
      - include/webex.css
    include-after-body: 
      - include/webex.js 
    page-navigation: true
  
    
execute: 
  freeze: auto
  warning: false
  message: false
  
knitr: 
  opts_chunk: 
    out.width: "100%"


editor: visual
